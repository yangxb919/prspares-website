# prspares.xyz —— 旧域名，2026-08-01 起 301 到主域。
# 理由：xyz 此前对爬虫返回 200 且内容与主域完全重复，Googlebot 把两个域名当独立站点
# 各抓一遍，瓜分本就紧张的抓取预算（近两周主域+xyz 合计仅 1218 次，是 AI 爬虫的 1/6）。
# canonical 只能决定"算谁的分"，无法阻止抓取动作本身。301 同时把 xyz 的历史外链权重
# 传递给主域。人类访问与老书签不受影响（自动跳转），Google Ads 落地页全部用主域、不涉及。
server {
    server_name prspares.xyz www.prspares.xyz;

    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/prspares.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prspares.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 健康检查保留在本域直接返回，避免监控探针跟随 301 后误判
    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # /api/ 不做 301：表单走相对路径 POST /api/send-rfq-email，而 301 会让浏览器把
    # POST 降级成 GET 并丢弃 body —— 在 301 生效前就已打开 xyz 页面的用户点提交会丢询盘。
    # （xyz 历史上承接过 12/88 的询盘，这条不能省。）API 端点不是内容页，不影响去重目的。
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20m;
    }

    location / {
        return 301 https://www.phonerepairspares.com$request_uri;
    }
}

server {
    if ($host = www.prspares.xyz) {
        return 301 https://$host$request_uri;
    }

    if ($host = prspares.xyz) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name prspares.xyz www.prspares.xyz;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name phonerepairspares.com www.phonerepairspares.com;
    return 301 https://www.phonerepairspares.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name phonerepairspares.com;

    ssl_certificate /etc/letsencrypt/live/prspares.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prspares.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.phonerepairspares.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.phonerepairspares.com;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/prspares.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prspares.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # robots.txt 缓存 24h（2026-08-01）。上游 Next.js 返回 Cache-Control: max-age=0，
    # 导致 Googlebot 两周内重复抓取 robots.txt 303 次 —— 占其全部抓取预算的 25%。
    # 必须先 proxy_hide_header 再 add_header，否则两个 Cache-Control 会同时下发。
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
